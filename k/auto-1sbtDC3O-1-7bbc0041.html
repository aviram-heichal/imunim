:root{--p1:#1e40af;--p2:#0ea5e9;--acc:#ff9f1c;--num:#1e3a8a;--ink:#0f1d3d;--bg:#f3f7ff;--a1:#bcd3ff;--a2:#a5f0ff;--a3:#ffd8a8;--ok:#12b76a;--bad:#ff4d6d;--warn:#f59e0b;

--sh:0 14px 34px -16px color-mix(in srgb,var(--p2) 55%,transparent),0 2px 6px -2px rgba(20,20,60,.08);
--grad:linear-gradient(120deg,var(--p1),var(--p2));--r:22px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{margin:0;min-height:100vh;font-family:Fredoka,Heebo,system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);overflow-x:clip;padding-bottom:70px;line-height:1.4}
button{font-family:inherit}

/* ---------- רקע: אורורה זזה + דוגמת העולם + גרעיניות ---------- */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
.aurora i:nth-child(1){background:var(--a1);top:-30vmax;inset-inline-start:-25vmax;animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--a2);top:20vh;inset-inline-end:-35vmax;animation:drift2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:var(--a3);bottom:-40vmax;inset-inline-start:0;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-10vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(12vmax,-16vmax) scale(1.1)}}

/* ---------- ראש הדף ---------- */
.hero{display:flex;align-items:center;gap:12px;padding:18px 16px 6px;max-width:640px;margin:0 auto}
.mascot{width:76px;height:76px;flex:0 0 auto;display:grid;place-items:center;filter:drop-shadow(0 10px 12px color-mix(in srgb,var(--p2) 35%,transparent));animation:bob 3.2s ease-in-out infinite}
.mascot .emo{font-size:52px}
.mascot.squish{animation:squish .55s,bob 3.2s ease-in-out .55s infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.28,.72)}55%{transform:scale(.86,1.16)}80%{transform:scale(1.05,.95)}100%{transform:scale(1,1)}}
.hello{flex:1;min-width:0}
.hi{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.sub{font-size:16px;font-weight:500;opacity:.75;margin-top:4px}
#mute{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--edge);background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:20px;cursor:pointer;box-shadow:var(--sh)}

/* "מה מתרגלים השבוע" - גדול, כהה על בהיר, קריא */
.mission{max-width:608px;margin:10px auto 0;margin-inline:max(16px,calc(50% - 304px));padding:14px 16px;border-radius:var(--r);background:var(--glass2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--edge);box-shadow:var(--sh);position:relative;overflow:hidden}
.mission::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--grad)}
.mlbl{font-size:14px;font-weight:600;color:var(--num);letter-spacing:.2px}
.mtop{font-size:20px;font-weight:600;line-height:1.35;margin-top:4px}
.mrev{display:inline-block;margin-top:8px;font-size:15px;font-weight:500;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--p2) 12%,#fff)}

/* ---------- פס עליון דביק: כוכבים + טבעת התקדמות ---------- */
.hud{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:10px;margin:14px auto 0;margin-inline:max(12px,calc(50% - 308px));max-width:616px;padding:8px 10px 8px 14px;border-radius:999px;background:var(--glass2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1.5px solid var(--edge);box-shadow:var(--sh)}
.bigstar{display:flex;align-items:center;gap:6px;font-size:30px;line-height:1;font-weight:700;flex:0 0 auto}
.bigstar svg{width:48px;height:48px;filter:drop-shadow(0 4px 4px rgba(160,100,0,.28))}
.bigstar b{font-size:26px;font-variant-numeric:tabular-nums;min-width:1ch}
.bigstar.bump svg,.bigstar.bump .se{animation:squish .5s}
.startxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#starTxt{font-size:15px;font-weight:600;line-height:1.2}
.tray{display:flex;flex-wrap:nowrap;align-items:center;gap:1px;min-height:22px;overflow:hidden;direction:rtl}
.tray>span{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;font-size:17px;line-height:1}
.tray>span svg{width:30px;height:30px;filter:drop-shadow(0 3px 3px rgba(60,20,70,.18))}
.tray>span.new{animation:drop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes drop{0%{transform:translateY(-26px) scale(.3);opacity:0}60%{opacity:1}100%{transform:none}}
.tray>b{flex:0 0 auto;font-size:13px;font-weight:700;margin-inline-start:4px;color:var(--num)}
.ring{position:relative;width:48px;height:48px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:color-mix(in srgb,var(--p2) 14%,#fff)}
.ring .arc{stroke:url(#rg);transition:stroke-dashoffset .6s cubic-bezier(.3,1.4,.5,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;direction:ltr}

/* ---------- בחירת יום: 6 "אבני משחק" ---------- */
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:616px;margin:14px auto 0;padding:0 12px}
nav button{position:relative;height:78px;border-radius:18px;border:1.5px solid var(--edge);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .2s;box-shadow:0 6px 16px -10px rgba(30,30,80,.35);padding:0}
nav button small{font-size:18px;font-weight:600;opacity:.85}
nav button b{font-size:24px;font-weight:700;margin-top:1px}
nav button:active{transform:scale(.94)}
nav button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--p2) 70%,transparent);transform:translateY(-3px)}
nav button.on small{opacity:.9}
nav button.done::after{content:"✓";position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2.5px #fff}

/* ---------- היום ---------- */
main{max-width:640px;margin:0 auto;padding:0 16px;counter-reset:q}
h2{font-size:24px;font-weight:700;margin:22px 0 8px;line-height:1.2}
.fwdefs{padding:14px 16px;border-radius:18px;background:var(--glass);border:2px solid color-mix(in srgb,var(--p1) 60%,#fff);font-size:21px;line-height:1.55;margin:8px 0}.flb{display:block;width:100%;padding:14px;margin:6px 0;border:0;border-radius:14px;background:var(--p1);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}.flp svg{display:block;width:200px;height:200px;margin:6px auto}.fwtask{padding:10px 14px;border-radius:18px;background:color-mix(in srgb,var(--p1) 14%,#fff);font-size:16px;font-weight:600;margin:8px 0}.fwgame{display:block;text-align:center;padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:20px;font-weight:700;text-decoration:none;margin:8px 0}.tip{padding:12px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px dashed color-mix(in srgb,var(--p1) 45%,#fff);font-size:16px;margin:8px 0}
.prog{height:8px;border-radius:99px;background:color-mix(in srgb,var(--p2) 12%,#fff);overflow:hidden;margin:14px 0 4px}
.prog>div{height:100%;width:0;background:var(--grad);border-radius:99px;box-shadow:0 0 12px var(--p1);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
#plab{font-size:13px;font-weight:600;opacity:.65}
h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin:22px 0 10px}
h3::before{content:"";width:10px;height:10px;border-radius:4px;background:var(--grad);transform:rotate(45deg);flex:0 0 auto;box-shadow:0 0 10px var(--p1)}

/* ---------- כרטיס תרגיל ---------- */
.card{position:relative;counter-increment:q;display:flex;flex-direction:column;gap:10px;margin:26px 0;padding:18px 14px 14px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--edge);box-shadow:var(--sh);transition:border-color .3s,background .3s,box-shadow .3s;animation:rise .5s both}
.card::before{content:counter(q);position:absolute;top:-10px;inset-inline-start:14px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--grad);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 10px -3px color-mix(in srgb,var(--p2) 60%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card.ok{border-color:color-mix(in srgb,var(--ok) 70%,#fff);background:color-mix(in srgb,var(--ok) 9%,rgba(255,255,255,.7));box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 15%,transparent),var(--sh)}
.card.ok::after{content:"✓";position:absolute;top:-12px;inset-inline-end:12px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;font-size:17px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 6px 14px -4px var(--ok);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.card.bad{animation:shake .35s;box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 22%,transparent),var(--sh)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.math{font-size:26px;font-weight:600}
.card .row .math,.card>.row>.ltr{font-size:26px;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;font-weight:600;margin:0 3px}.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px}
input{font-family:inherit;font-size:24px;font-weight:600;width:96px;height:52px;padding:4px 8px;border-radius:16px;border:2px solid color-mix(in srgb,var(--num) 30%,#fff);background:#fff;color:var(--ink);text-align:center;outline:none;transition:border-color .2s,box-shadow .2s;box-shadow:inset 0 2px 4px rgba(20,20,60,.06)}
input:focus{border-color:var(--num);box-shadow:0 0 0 5px color-mix(in srgb,var(--num) 18%,transparent)}
input:disabled{background:color-mix(in srgb,var(--ok) 10%,#fff);border-color:color-mix(in srgb,var(--ok) 55%,#fff);color:#0b7a48}
input.wide{width:100%;text-align:start;font-size:19px}input.sm{width:66px}
.box{display:inline-block;width:30px;height:24px;border:2px solid currentColor;border-radius:7px;vertical-align:middle}
button.chk{width:52px;height:52px;flex:0 0 auto;border:0;border-radius:50%;background:var(--grad);color:#fff;font-size:24px;font-weight:700;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 18px -6px color-mix(in srgb,var(--p2) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
button.chk:active{transform:scale(.9)}
.card>button.chk{align-self:flex-end}
.opt{font-family:inherit;font-size:18px;font-weight:600;padding:12px 16px;border-radius:16px;border:2px solid color-mix(in srgb,var(--num) 22%,#fff);background:var(--glass2);color:var(--ink);text-align:start;cursor:pointer;transition:transform .15s,background .2s}
.opt:active{transform:scale(.97)}
.opt[style*="ltr"]{min-width:64px;font-size:26px;text-align:center}
.opt.sel-ok{background:linear-gradient(120deg,#12b76a,#34d399);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px #12b76a}
.opt.sel-bad{background:linear-gradient(120deg,#ff4d6d,#ff8a5c);color:#fff;border-color:transparent}
.opt:disabled{cursor:default}
.msg{font-weight:600;font-size:16px;min-height:0}.msg:empty{display:none}.msg.ok{color:#0b8a50}.msg.bad{color:#e0244a}
.vert{direction:ltr;font-size:26px;font-weight:600;display:inline-grid;text-align:right;font-variant-numeric:tabular-nums}.vert .u{border-bottom:3px solid currentColor}
.vg{direction:ltr;display:inline-grid;grid-template-columns:26px repeat(var(--w),46px);gap:2px 4px;font-size:30px;font-weight:600;text-align:center;align-items:center;font-variant-numeric:tabular-nums}
.vg .ln{grid-column:1/-1;border-top:3px solid currentColor;margin:2px 0 4px}
.vg input.d1{width:46px;height:54px;padding:0;font-size:28px;border-radius:12px}
.vg input.h1{width:46px;height:34px;padding:0;font-size:19px;border-radius:9px;border-style:dashed;text-align:center}
.vhint{font-size:15px;opacity:.7;margin-top:2px}
#more{margin-top:18px}.mask{text-align:center;margin:18px 0}.mdid{font-size:18px;font-weight:600;margin-bottom:10px}.morego{font-size:21px;padding:15px 30px}
.tbar{position:relative;z-index:5;background:#14284b;color:#fff;font-size:16px;line-height:1.5;padding:10px 16px;text-align:center}.tbar a{color:#ffd76a;font-weight:700;white-space:nowrap;margin-inline-start:8px}
.pic{font-size:26px;letter-spacing:3px;display:flex;flex-wrap:wrap;gap:4px}.pic svg{max-width:100%;height:auto}
.grp{display:inline-flex;gap:1px;padding:3px 6px;border:2px dashed color-mix(in srgb,var(--p2) 40%,#fff);border-radius:12px;background:var(--glass2)}
.sys .eqs{display:flex;flex-direction:column;gap:2px;border-left:3px solid currentColor;border-radius:12px 0 0 12px;padding:2px 10px}.mans{display:inline-flex;gap:14px;align-items:center;flex-wrap:wrap}.mans .gap{width:10px}.mans.pt{gap:6px}.ml{display:inline-flex;gap:6px;align-items:center;font-weight:600}

/* המילה הסודית */
.secret{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.secret span{width:46px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;background:linear-gradient(var(--glass2),var(--glass2)) padding-box,var(--grad) border-box;border:2.5px solid transparent;color:var(--num);box-shadow:var(--sh)}
.secret span:not(:empty){background:var(--grad);color:#fff;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}

/* ---------- סיכום היום ---------- */
.sum{position:relative;overflow:hidden;text-align:center;color:#fff;border-radius:28px;padding:26px 18px;margin:24px 0;background:var(--grad);box-shadow:0 24px 50px -20px color-mix(in srgb,var(--p2) 80%,transparent)}
.sum::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.22),transparent 30%);animation:spin 6s linear infinite}
.sum>*{position:relative}
@keyframes spin{to{transform:rotate(1turn)}}
.sum h2{margin:0 0 8px;font-size:28px;color:#fff}
.sum .big{font-size:18px;font-weight:600;margin:8px 0}
.sum .score{font-size:60px;font-weight:700;line-height:1;direction:ltr;color:var(--acc);text-shadow:0 4px 18px rgba(0,0,0,.18)}
.sum a{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#fff;color:#0f9d58;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:17px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.sum .big svg{vertical-align:middle}

/* ---------- אתגר הדקה ---------- */
.minute{margin:24px 0;padding:18px 14px;border-radius:26px;text-align:center;background:linear-gradient(var(--glass2),var(--glass2)) padding-box,var(--grad) border-box;border:2.5px solid transparent;box-shadow:var(--sh)}
.mhead{display:flex;flex-direction:column;gap:2px}.mhead b{font-size:22px;font-weight:700}.mhead span{font-size:15px;opacity:.75}
.mhead .mearn{opacity:1;font-weight:600;color:var(--num);font-size:15px;margin-top:4px}
.mhist{margin:8px 0;font-weight:600;min-height:1em;font-size:15px}
.mgo{font-family:inherit;font-weight:700;font-size:17px;padding:11px 24px;border-radius:999px;border:0;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--p2) 75%,transparent)}
.mgo:active{transform:scale(.95)}
.mclock{position:relative;width:120px;height:120px;margin:6px auto}
.mclock svg{width:100%;height:100%;transform:rotate(-90deg)}
.mclock circle{fill:none;stroke-width:8;stroke-linecap:round}
.mclock .trk{stroke:color-mix(in srgb,var(--p2) 14%,#fff)}
.mclock .arc{stroke:url(#mg);transition:stroke-dashoffset .12s linear}
.mclock span{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.mclock.low span{color:var(--bad);animation:pulse 1s infinite}.mclock.low .arc{stroke:var(--bad)}
@keyframes pulse{50%{transform:scale(1.12)}}
.mbar{display:none}
.mcount{font-weight:700;font-size:17px;color:var(--num)}
.mq{font-size:34px;font-weight:700;margin:10px 0;direction:ltr}.mq .mpic svg{display:block;width:170px;height:170px;margin:0 auto 6px;animation:mhide 0s linear 3s forwards}@keyframes mhide{to{visibility:hidden}}.mopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.mopt{font:inherit;font-size:22px;font-weight:700;padding:10px 16px;border:2px solid var(--p1);border-radius:14px;background:#fff;color:#1b2a5e;cursor:pointer}
.mq input{font-size:30px;width:120px;height:60px}
.mq input.mgood{background:#dcfce7;border-color:var(--ok);color:#0b7a48}
.mq input.mbad{background:#ffe4e8;border-color:var(--bad);color:#c81e44}
.mq input.mskip{background:#fff4d6;border-color:var(--warn);color:#a35e00}
.mfb{min-height:26px;font-weight:700;font-size:18px}.mfb.yes{color:var(--ok);font-size:26px}.mfb.no{color:var(--bad)}.mfb.skip{color:#b26a00}
.mlog{max-height:280px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 10px;border-radius:14px;font-size:20px;font-weight:600;background:#fff;animation:rise .35s both}
.mrow.good{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ok) 70%,#fff)}.mrow.skip{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--warn) 70%,#fff)}.mrow.bad{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 70%,#fff);background:#fff5f6}.mwrong{color:#c81e44;text-decoration-thickness:2px}.mrow .mpic{display:none}
.mrq{direction:ltr}.mrq b{color:var(--num)}
.mdone{font-size:20px;font-weight:700;margin:8px 0}.mlh{font-size:15px;margin-top:10px;opacity:.75}
.shake{animation:shake .35s}
.mfb.skip{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px}
.mbigans{display:block;font-size:54px;line-height:1.05;color:#b26a00;direction:ltr;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.mfb.skip span{font-size:16px;opacity:.85}
.mq input.mskip{font-size:34px;font-weight:700}
.card.shown{border-color:color-mix(in srgb,var(--warn) 65%,#fff);background:color-mix(in srgb,var(--warn) 8%,rgba(255,255,255,.75))}
.card.shown::after{content:"💡";position:absolute;top:-12px;inset-inline-end:12px;width:30px;height:30px;border-radius:50%;background:#fff3d6;display:grid;place-items:center;font-size:16px;box-shadow:0 0 0 3px #fff;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.msg.shown{color:#8a5200;font-size:16px}.msg.shown .rv{font-size:28px;margin-inline-start:6px;direction:ltr;unicode-bidi:isolate}.msg.shown span{font-size:14px;font-weight:500}
.card.shown input:disabled{background:#fff3d6;border-color:var(--warn);color:#8a5200}
.opt.sel-ans{background:#fff3d6;border-color:var(--warn);color:#8a5200}
nav button.locked{opacity:.55;background:var(--glass);box-shadow:none}
nav button.locked i{position:absolute;bottom:2px;font-size:12px;font-style:normal}
nav button.locked b{opacity:.6}
.lockn{margin-top:10px;font-size:16px;font-weight:600;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px}

/* צילום הדף */
.photo{margin:20px 0;padding:16px;border-radius:22px;text-align:center;background:var(--glass);border:2px dashed color-mix(in srgb,var(--p1) 45%,#fff)}
.photo p{margin:0 0 10px;font-weight:600}
.pbtn{display:inline-block;padding:11px 22px;border-radius:999px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.pmsg{margin-top:8px;font-weight:600}

/* הודעה קופצת + כוכב שעף לספירה */
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px) scale(.8);opacity:0;z-index:60;padding:12px 24px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:21px;white-space:nowrap;box-shadow:0 14px 30px -10px color-mix(in srgb,var(--p2) 80%,transparent);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.fly{position:fixed;z-index:70;width:34px;height:34px;pointer-events:none;font-size:30px;line-height:1;transition:transform .75s cubic-bezier(.55,-0.35,.6,1),opacity .2s .6s}
.fly svg{width:34px;height:34px}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

/* ---------- 🤩 25.10: סקווישים מרחפים ברקע ---------- */
.floaties{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.floaties i{position:absolute;left:var(--x);bottom:-90px;width:var(--s);height:var(--s);opacity:.5;filter:drop-shadow(0 10px 14px rgba(80,40,80,.18));animation:floatUp var(--d) linear var(--dl) infinite}
.floaties i svg{width:100%;height:100%}
@keyframes floatUp{0%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-60vh) translateX(18px) rotate(8deg)}100%{transform:translateY(-120vh) rotate(-8deg)}}
/* ---------- מסך פתיחה ---------- */
#intro{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;color:#fff;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--a1) 90%,#fff),transparent 55%),radial-gradient(circle at 80% 80%,color-mix(in srgb,var(--a2) 90%,#fff),transparent 55%),var(--grad);overflow:hidden}
#intro[hidden]{display:none}
#intro .iglow{position:absolute;width:140vmax;height:140vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 10deg,transparent 10deg 22deg);animation:spin 40s linear infinite;pointer-events:none}
.imascot{position:relative;width:190px;height:190px;filter:drop-shadow(0 24px 26px rgba(60,20,70,.35));animation:dropIn .9s cubic-bezier(.3,1.7,.5,1) both,bob 3s ease-in-out 1s infinite;cursor:pointer}
.imascot.squish{animation:squish .55s,bob 3s ease-in-out .55s infinite}
.imascot svg{width:100%;height:100%}
@keyframes dropIn{0%{transform:translateY(-70vh) scale(.4) rotate(-30deg)}70%{transform:translateY(10px) scale(1.08,.92)}100%{transform:none}}
.ihi{position:relative;font-size:clamp(38px,11vw,60px);font-weight:700;text-shadow:0 6px 20px rgba(60,20,70,.35);animation:rise .6s .5s both}
.iline{position:relative;min-height:2.6em;font-size:clamp(22px,6.5vw,30px);font-weight:600;max-width:520px;text-shadow:0 3px 12px rgba(60,20,70,.3)}
.iline span{display:inline-block;margin:0 .14em;animation:wordPop .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes wordPop{from{opacity:0;transform:translateY(12px) scale(.6)}}
.iplay,.ibtn{position:relative;border:none;border-radius:999px;font-weight:700;cursor:pointer;color:var(--p2);background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7),0 18px 30px -12px rgba(60,20,70,.5);animation:glowPulse 1.6s ease-in-out infinite}
.iplay[hidden],.ibtn[hidden]{display:none}
.iplay{font-size:24px;padding:14px 34px}
.ibtn{font-size:clamp(26px,8vw,36px);padding:16px 46px;animation:popIn .5s cubic-bezier(.3,1.8,.5,1) both,glowPulse 1.6s ease-in-out .5s infinite}
@keyframes popIn{from{transform:scale(0) rotate(-12deg)}}
@keyframes glowPulse{50%{box-shadow:0 0 0 18px rgba(255,255,255,0),0 18px 30px -12px rgba(60,20,70,.5);transform:scale(1.06)}}
#intro.out{animation:introOut .65s ease-in forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.25);filter:blur(6px)}}
body.intro-on{overflow:hidden}
/* ---------- חגיגה על תשובה נכונה ---------- */
#cele{position:fixed;inset:0;z-index:80;pointer-events:none}
#cele .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95),color-mix(in srgb,var(--acc) 45%,transparent) 35%,transparent 70%);animation:flash .55s ease-out forwards}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#cele .pop{position:absolute;left:50%;top:42%;width:170px;height:170px;margin:-85px 0 0 -85px;display:grid;place-items:center;animation:popUp 1.15s cubic-bezier(.3,1.6,.5,1) forwards}
#cele .pop.mega{animation-duration:1.7s}
#cele .pop.mega .pk{width:190px;height:190px}
#cele .rays{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--acc) 80%,#fff) 0 9deg,transparent 9deg 24deg);mask-image:radial-gradient(circle,#000 25%,transparent 68%);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 2.4s linear infinite}
#cele .pk{position:relative;width:150px;height:150px;filter:drop-shadow(0 18px 20px rgba(60,20,70,.35))}
#cele .pk svg{width:100%;height:100%}
#cele .pop b{position:absolute;bottom:-26px;font-size:34px;font-weight:700;color:#fff;background:var(--grad);padding:2px 18px;border-radius:999px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--p2) 80%,transparent);white-space:nowrap}
@keyframes popUp{0%{transform:scale(0) rotate(-35deg);opacity:0}22%{transform:scale(1.25) rotate(8deg);opacity:1}38%{transform:scale(.92,1.08) rotate(-3deg)}52%{transform:scale(1)}80%{transform:translateY(-14px) scale(1);opacity:1}100%{transform:translateY(-70px) scale(.5);opacity:0}}
.card.glow{animation:cardGlow .9s ease-out}
@keyframes cardGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}40%{box-shadow:0 0 0 14px color-mix(in srgb,var(--ok) 0%,transparent),0 0 40px 6px color-mix(in srgb,var(--acc) 60%,transparent);transform:scale(1.025)}100%{box-shadow:var(--sh);transform:none}}
body.jolt main{animation:jolt .35s}
@keyframes jolt{30%{transform:translateY(3px)}60%{transform:translateY(-2px)}}
button.chk{position:relative;overflow:hidden}
button.chk::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.qbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nikb{border:2px solid color-mix(in srgb,var(--p2) 45%,#fff);background:var(--glass2);color:var(--p2);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;cursor:pointer}
.nikb.on{background:var(--grad);color:#fff;border-color:transparent}

// להבחין בין מקומות: מספר חדש עם אותה כמות ספרות, ואותה ספרה פעם באחדות ופעם בעשרות, בסדר אקראי
function ladMix(base, op, P) {
  // המספר החדש שומר על המאות/האלפים של התרגיל ומחליף רק עשרות ואחדות (49 -> 56), כדי שלא יהיה קשה יותר
  if (base % 10 === 0 || Math.floor(base / 10) % 10 === 0) return null;
  var F = ladFmt, len = String(base).length, tries = 0, high = base - base % 100;
  var u0 = P[0].k === 0 ? P[0].d : 0, regroup = op === '+' ? (base % 10) + u0 >= 10 : (base % 10) < u0;
  while (tries++ < 200) {
    var nb = high + 10 * ladRnd(1, 9) + ladRnd(1, 9), d = ladRnd(1, 9);
    if (nb === base || nb % 10 === 0) continue;
    var o = nb % 10, t = Math.floor(nb / 10) % 10;
    if (op === '-') { if (nb < d * 10 + 1 || t < d) continue; if ((o < d) !== regroup) continue; }
    else { if (t + d >= 10) continue; if ((o + d >= 10) !== regroup) continue; }
    var s1 = ladStep(F(nb) + ' ' + op + ' ' + d + ' = ☐', op === '+' ? nb + d : nb - d, '🔍 ' + (op === '+' ? 'מוסיפים' : 'מורידים') + ' אחדות או עשרות?');
    var s2 = ladStep(F(nb) + ' ' + op + ' ' + (d * 10) + ' = ☐', op === '+' ? nb + d * 10 : nb - d * 10, '🔍 ' + (op === '+' ? 'מוסיפים' : 'מורידים') + ' אחדות או עשרות?');
    return Math.random() < 0.5 ? [s1, s2] : [s2, s1];
  }
  return null;
}

// ======================= בתוך דף הילד =======================
var LAD_ON = typeof document !== 'undefined' && typeof DATA !== 'undefined' && !!DATA.lad && document.documentElement.lang !== 'en', LAD_DEPTH = 2;
function ladStars() { var n = 0; if (!S.lad) return 0; Object.keys(S.lad).forEach(function (k) { (S.lad[k].log || []).forEach(function (x) { if (x.ok) n++; }); }); return n; }
function ladLabel(key) { var p = key.replace(/^x/, '').split('-'); return { day: Number(p[0]) + 1, item: (key.charAt(0) === 'x' ? 'עוד ' : '') + (Number(p[1]) + 1) }; }

// נקרא מ-check() בטעות הראשונה. true = המדרגות נפתחו
function ladStart(key, card, msg, it) {

}
function ladLock(card, on) { card.querySelectorAll('input,.opt,button.chk').forEach(function (x) { x.disabled = on; }); card.classList.toggle('laddering', on); }

  var old = card.nextSibling; if (old && old.classList && old.classList.contains('lad')) old.remove();

  if (msg) { msg.className = 'msg lad-m'; msg.textContent = '🪜 קודם עולים במדרגות למטה ⬇️ ואז חוזרים לכאן'; }

function ladStairsHtml(L) {

function ladDraw(key, card, it, box) {
  var L = S.lad[key], now = box.querySelector('.lnow');

    '<div class="row"><span class="ltr math">' + esc(s.q).replace('☐', inp) + '</span><button class="chk" aria-label="בדיקה">✓</button></div><div class="msg"></div></div>';

    // טעה במדרגה: עוד מדרגה למטה (פעם אחת), ואחר כך חוזרים למדרגה הזו
    var sub = !s.x && (s.d || 0) < LAD_DEPTH ? ladderOf(s.q) : null;

    busy = true; x.value = s.a; x.disabled = true; btn.remove();
    L.log.push({ q: s.q, ok: 0, m: s.m }); L.i++; save();

    setTimeout(function () { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); var f = card.querySelector('input:not([disabled])'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {} }, 700);
  }
}
